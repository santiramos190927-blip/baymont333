backend:
  name: git-gateway
  identity_url: https://baymlntdtc333.netlify.app/.netlify/identity
  branch: main

media_folder: "images/products"
public_folder: "/images/products"

collections:
  - name: "products"
    label: "Productos"
    files:
      - name: "catalog"
        label: "Catálogo"
        file: "contenido/productos.json"
        fields:
          - label: "Productos"
            name: "products"
            widget: "list"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Precio", name: "price", widget: "number" }
              - { label: "Tallas", name: "sizes", widget: "string" }
              - { label: "Foto", name: "image", widget: "image", required: false }
              - { label: "Descripción", name: "description", widget: "string", required: false }
              - { label: "Categoría", name: "category", widget: "select", options: ["sudaderas", "camisas"], default: "sudaderas" }
              - { label: "Disponible", name: "available", widget: "boolean", default: true }
